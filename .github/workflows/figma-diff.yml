      #   run: |
      #     node -e "
      #       const r = require('./report.json');
      #       if (r.summary.missing > 0) {
      #         console.error(\`\${r.summary.missing} element(s) missing from the DOM\`);
      #         process.exit(1);
      #       }
      #     "
